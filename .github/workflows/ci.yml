name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Bounded because two steps in this job reach the network on their own:
    # postbuild's link gate calls the GitHub API, and `fetch the agent
    # contracts` curls eight raw files. Without a ceiling a hung connection
    # rides GitHub's 6-hour default, holding a runner and telling nobody.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The unit tier, over the pure functions in src/lib/. First because it is
      # the cheapest signal in the job: it needs none of the five checkouts
      # below and none of the network, so a broken rewriter fails in seconds
      # rather than after a four-minute build. The postbuild gates remain the
      # tier that actually proves the published site is sound.
      - name: test (vitest)
        run: pnpm test
      # Supply-chain gate. osv-scanner checks the committed pnpm-lock.yaml against
      # the OSV database and exits non-zero on a known vulnerability: an
      # endpoint-independent, maintained hard gate. Pinned to an exact version.
      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
      # The /catalog/ reference is generated from the catalog at build time —
      # every template, composite and standard page. Checked out after
      # osv-scanner so the scan stays scoped to this repo's own lockfile, and
      # unpinned so the published reference tracks the catalog rather than a
      # snapshot of it. A catalog that will not load fails the build loudly
      # rather than shipping an empty reference; see src/lib/catalog.ts.
      - name: checkout the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/nanohype
          path: .org/nanohype
      # The /repos/ pages render each repo's AGENTS.md. The SDK resolves those
      # from checkouts beside the catalog, mirroring the org layout, so `.org/`
      # reproduces that layout — only the one file each, since nothing else is
      # read. `curl -f` exits non-zero on a 404, so a renamed or deleted
      # contract fails here rather than vanishing from the published list.
      - name: fetch the agent contracts
        run: |
          for r in landing-zone eks-gitops eks-agent-platform kx cloudgov fab portal eks-fleet; do
            mkdir -p ".org/$r"
            curl -fsSL -o ".org/$r/AGENTS.md" \
              "https://raw.githubusercontent.com/nanohype/$r/main/AGENTS.md"
          done
      # The /atlas/ pages render the diagrams that repo emits, and caption them
      # from the manifest emitted beside them. Not committed here: the pages
      # show what the atlas last emitted rather than a copy someone has to
      # remember to refresh.
      - name: checkout the atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/.github
          path: .atlas
      # The /platform/resources/ reference is generated from the API definitions
      # the org's two control planes ship, and postbuild checks every apiVersion
      # and kind the whole site prints against them. Sparse: the definitions are
      # the entire input, and a full checkout would only invite reading more.
      - name: checkout the platform CRDs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-agent-platform
          path: .platform
          sparse-checkout: charts/operator/crds
          sparse-checkout-cone-mode: false
      - name: checkout the fleet API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-fleet
          path: .fleet
          sparse-checkout: apis
          sparse-checkout-cone-mode: false
      - run: pnpm build
        env:
          NANOHYPE_CATALOG_DIR: ${{ github.workspace }}/.org/nanohype
          NANOHYPE_ATLAS_DIR: ${{ github.workspace }}/.atlas/profile/assets/atlas
          NANOHYPE_CRDS_DIR: ${{ github.workspace }}/.platform/charts/operator/crds
          NANOHYPE_XRDS_DIR: ${{ github.workspace }}/.fleet/apis
          # postbuild's link gate asks the API for one tree listing per org repo
          # a page links into, and checks every link against it. The token is
          # for rate limit only — the repos it reads are public. Without one the
          # gate would still run, but a busy hour could exhaust the anonymous
          # limit, and it fails rather than passing on a listing it could not
          # read: a check that silently stops checking is the defect it exists
          # to catch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Type gate. `astro check` typechecks the .astro components and the TS
      # under src/ together, which nothing else here does: `astro build` emits
      # without typechecking, and Biome lints without reading types.
      #
      # It runs in CI because leaving it to a local `pnpm check` is what let a
      # TypeScript 7 bump merge green while asserting the repo "typechecks with
      # it directly" — an assertion no job was in a position to contradict.
      # TypeScript 7 does not expose the programmatic compiler API this drives,
      # so renovate.json holds the 6.x line; the hold and this step are one fix.
      #
      # After the build: both need the checked-out catalog, and a content-load
      # failure produces a far better message from the loaders than from the
      # type checker downstream of them.
      - name: typecheck (astro check)
        run: pnpm run check
        env:
          NANOHYPE_CATALOG_DIR: ${{ github.workspace }}/.org/nanohype
          NANOHYPE_ATLAS_DIR: ${{ github.workspace }}/.atlas/profile/assets/atlas
          NANOHYPE_CRDS_DIR: ${{ github.workspace }}/.platform/charts/operator/crds
          NANOHYPE_XRDS_DIR: ${{ github.workspace }}/.fleet/apis
      # Lint / format gate. Biome runs from the pinned devDependency and exits
      # non-zero on any lint violation or unformatted file. It reports only —
      # `pnpm format` is the writing half, and CI never writes.
      - name: lint (biome)
        run: pnpm run lint

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        build,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
