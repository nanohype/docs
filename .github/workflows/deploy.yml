name: deploy

# Runs after `ci` succeeds, not alongside it. Both workflows previously
# triggered on push to main with nothing between them, so a commit that failed
# lint or osv-scanner still shipped to production as long as `pnpm build`
# exited 0 — the supply-chain gate ran, and its verdict reached no one.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The same ceiling ci.yml carries, for the same reason and then one more.
    # This job reaches the network in four places — eight raw-file fetches, the
    # link gate's calls to the GitHub API, an S3 sync and a CloudFront
    # invalidation — and none of them bounds the job on its own. Without this a
    # stalled connection rides GitHub's 6-hour default, holding a runner while
    # the site silently goes un-updated.
    timeout-minutes: 20
    # Two conditions. The role check skips forks and mirrors, where no deploy
    # role is configured — the ARN comes from the docs.nanohype.dev site
    # component in infra/iac, set as a repository variable. The conclusion check
    # is the gate: `workflow_run` fires on *completion*, success or failure, so
    # without it this would deploy precisely the commits CI just rejected.
    # workflow_dispatch carries no workflow_run payload, so it is named
    # explicitly rather than left to evaluate against an absent field.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      # `workflow_run` checks out the default branch at HEAD, not the commit
      # that triggered the run. On a busy main those differ, and the deploy
      # would ship a commit CI never looked at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The /catalog/ reference is generated from the catalog at build time, so
      # the deploy needs it checked out too. Unpinned, like CI: what ships is
      # the catalog as it stands, and a catalog that will not load fails the
      # deploy rather than publishing an empty reference.
      - name: Checkout the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/nanohype
          path: .org/nanohype

      # The /repos/ pages render each repo's AGENTS.md, which the SDK resolves
      # from checkouts beside the catalog. `.org/` reproduces that layout with
      # only the one file each; `curl -f` fails the deploy on a missing one.
      #
      # `--max-time` because curl bounds only the connect phase by default: a
      # connection that opens and then stalls mid-transfer never returns. Eight
      # of these run in series, and thirty seconds is far above a file of this
      # size, so the bound only fires on a transfer that has actually died.
      - name: Fetch the agent contracts
        run: |
          for r in landing-zone eks-gitops eks-agent-platform kx cloudgov fab portal eks-fleet; do
            mkdir -p ".org/$r"
            curl -fsSL --max-time 30 -o ".org/$r/AGENTS.md" \
              "https://raw.githubusercontent.com/nanohype/$r/main/AGENTS.md"
          done

      - name: Checkout the atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/.github
          path: .atlas

      # The /platform/resources/ reference is generated from the API definitions
      # the org's two control planes ship, and postbuild checks every apiVersion
      # and kind on the site against them. Sparse: the definitions are the whole
      # input.
      - name: Checkout the platform CRDs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-agent-platform
          path: .platform
          sparse-checkout: charts/operator/crds
          sparse-checkout-cone-mode: false

      - name: Checkout the fleet API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-fleet
          path: .fleet
          sparse-checkout: apis
          sparse-checkout-cone-mode: false

      - name: Build
        run: pnpm build
        env:
          NANOHYPE_CATALOG_DIR: ${{ github.workspace }}/.org/nanohype
          NANOHYPE_ATLAS_DIR: ${{ github.workspace }}/.atlas/profile/assets/atlas
          NANOHYPE_CRDS_DIR: ${{ github.workspace }}/.platform/charts/operator/crds
          NANOHYPE_XRDS_DIR: ${{ github.workspace }}/.fleet/apis
          # `pnpm build` runs postbuild, and postbuild's link gate asks the API
          # for one tree listing per org repo the pages link into. The token is
          # for rate limit only — every repo it reads is public — but without
          # one the anonymous limit is 60/hour per runner IP, and the gate needs
          # ten listings. It fails rather than passing on a listing it could not
          # read, so exhausting the limit blocks the deploy instead of shipping
          # unchecked links. ci sets this on the same step; deploy runs the same
          # build and needs it for the same reason.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync and invalidate
        env:
          BUCKET: nanohype-docs-site-767397986924
          DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          aws s3 sync dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
