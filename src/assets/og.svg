<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="nanohype — the k8s-native software factory">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- void ground, matching @shuttering/starlight's void.css -->
  <rect width="1200" height="630" fill="#0c1226" />
  <rect width="1200" height="630" fill="url(#beam)" />

  <!-- the beam 2x2 pixel-node mark, the same shape as src/assets/mark.svg -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="26" height="26" rx="5" fill="#3b82f6" />
    <rect x="32" y="0" width="26" height="26" rx="5" fill="#3b82f6" opacity="0.5" />
    <rect x="0" y="32" width="26" height="26" rx="5" fill="#3b82f6" opacity="0.5" />
    <rect x="32" y="32" width="26" height="26" rx="5" fill="#3b82f6" />
  </g>

  <text x="176" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="5.4" fill="#94a3b8">AGENT FACTORY</text>

  <text x="96" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="128" font-weight="600" letter-spacing="-3.8" fill="#dbe4f0">nanohype</text>

  <text x="96" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" fill="#94a3b8">The k8s-native software factory.</text>
  <text x="96" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" fill="#94a3b8">A catalog, a factory client, and the substrate it ships onto.</text>

  <!-- the scaffold line the hero also carries -->
  <rect x="96" y="502" width="612" height="64" rx="10" fill="#101a36"
        stroke="#3b82f6" stroke-opacity="0.22" />
  <text x="124" y="543" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="26" fill="#3b82f6">$</text>
  <text x="152" y="543" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="26" fill="#dbe4f0">npx @nanohype/sdk scaffold</text>

  <text x="1104" y="543" text-anchor="end"
        font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="26" fill="#5b647d">docs.nanohype.dev</text>
</svg>
