# pnpm settings live here, not in package.json.
#
# pnpm 11 stopped reading the `pnpm` field in package.json entirely, and it does
# so without failing — it prints "The following keys were ignored" and installs
# anyway. An override block left behind in package.json therefore stops applying
# the moment the package manager is bumped, and the tree silently relocks onto
# the versions these floors exist to keep out. pnpm 10 already reads this file,
# so the settings live in one place across both.
#
# Every entry below is a floor over a transitive dependency, not a direct one:
# nothing here appears in package.json, and each was added because osv-scanner
# — a required check — went red on the resolved lockfile.
#
# A floor is NOT a version to keep current, and this is the one thing to know
# before editing this block. Each entry is bounded by what its *parent* package
# declares, so the right value is the lowest one that clears the advisory inside
# the range the parent supports — not the newest release of the package. A bump
# past the parent's declared range resolves a dependency the parent never agreed
# to, which is a break waiting on whichever interop currently hides it. Renovate
# does not distinguish the two: it reads these as ordinary dependency pins and
# proposes majors for them, and such a PR has been merged here before. Check the
# parent's declared range before accepting one.
#
# The other half of that rule: when the parent's own floor rises past the
# advisory, the entry has no work left to do and should be deleted rather than
# carried. An override that changes nothing is one more thing to be bumped
# wrongly later.

# pnpm 11 holds a package for 24h after publish before it will install it. The
# floor is there so this tree is never the first consumer of a compromised
# publish — a hijacked package is usually caught and unpublished within hours,
# and waiting costs nothing on a dependency nobody is blocked on.
#
# Neither half of that applies to @shuttering. It is first-party: published from
# a repo under the same ownership as this one, deliberately, and announced. There
# is no third party to be compromised by, so the floor buys nothing here and only
# delays a bump for three days.
#
# Scoped to @shuttering on purpose. @nanohype/* is published to the public
# registry and consumed by people outside this org, so it keeps the floor and is
# held to the same bar as any other public dependency.
minimumReleaseAgeExclude:
  - '@shuttering/*'

overrides:
  # Clears the osv-scanner gate on the resolved tree; postcss arrives via astro.
  postcss: ">=8.5.18"

  # GHSA-7p8r-x3mc-p8w7 (HIGH) — host confusion; a URL whose authority is
  # introduced with a backslash parses to a different host than a resolver
  # reaches. The advisory patches 4.x at 4.1.2 and 3.x at 3.1.5 separately;
  # this tree resolves 4.x, so 4.1.2 is the correct floor here.
  fast-uri: ">=4.1.2"

  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 in js-yaml 3.x and 4.x below 4.3.1.
  #
  # Scoped to the 4.x line deliberately. astro 7 and Starlight pull js-yaml 5.x,
  # which the advisory does not cover: an unscoped `^4.3.1` drags the site's own
  # frontmatter parser down a major version, and an unbounded `>=4.3.1` collapses
  # both lines to 5.x. The scoped form moves only the vulnerable resolution.
  js-yaml@4: "^4.3.1"

# pnpm 11 turns an ignored build script into an install error where pnpm 10 only
# warned, and it renamed the setting: the pnpm 10 spellings
# (onlyBuiltDependencies, ignoredBuiltDependencies) are not read here and do not
# warn about being ignored — verified by setting each and watching the install
# fail on the same build. There is no key for "deliberately skipped", so a build
# is either allowed or the install does not complete.
#
# esbuild arrives transitively through astro. Its platform binary comes from the
# @esbuild/<platform> optional dependency, not from this script, which is why
# pnpm 10 skipped it and the site built anyway.
allowBuilds:
  esbuild: true
