# Advisories with no fix reachable through the dependency that pulls them in.
# Each entry names why it does not apply here and expires, so the scan raises it
# again on its own: by then either a patched release is reachable or the entry
# gets re-argued, not silently renewed.

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
ignoreUntil = 2026-12-05T00:00:00Z
reason = """
postcss-selector-parser is fixed only in 7.1.6, and every path to it pins 6.x:
postcss-nested 6.2.0 declares ^6.1.1, reached through @expressive-code/core
0.44 from astro-expressive-code and @astrojs/starlight. It parses the
selectors in this site's own CSS at build time, never untrusted input.
"""

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
effectiveUntil = 2026-12-08T00:00:00Z
reason = """
picomatch has no patched release: 4.0.7 and 2.3.2 are the newest 4.x and 2.x.
4.0.7 is reached through astro, vite and vitest directly and through
tinyglobby/fdir and @astrojs/internal-helpers; 2.3.2 through anymatch 3.1.3
under unstorage, from astro. The ReDoS needs the glob pattern itself to be a
single-branch repeated extglob, and every pattern here is fixed by those tools
or this repo's own config (Starlight's docs loader, vitest's include, Vite's fs
deny list). It runs only at build, dev and test time; the site ships static
files and no picomatch, so nothing a visitor sends ever becomes a pattern.
"""
